# ===== 灵犀 config.example.ini（示例，不含任何密钥）=====
# 用法：复制成 config.ini，把要用的项填上；不填也能跑（本机默认值）。
# 注意：真正的 config.ini **不要提交到仓库**（.gitignore 已排除）。
# OCR 那几项是"外部引擎的绝对路径"，换机器要自己填（留空就用默认值/不启用）。

# 宇之语·灵犀 v3.5.3 配置（本机版（通用：按登录账号的角色切换界面））
# 敏感项已清空，按需填写。改完重启服务生效。

[server]
host = 127.0.0.1
port = 8199
open_browser = yes

[model]
image_max_side = 1024
repo_id = google/embeddinggemma-2
model_dir = models/embeddinggemma-2
device = auto
dtype = auto
modality = full
default_dim = 768
batch_size = 8
max_length = 8192
offline = yes

[encoding]
default_prompt = none
normalize = yes

[download]
source = auto
mirror = 
workers = 4
proxy = 

[search]
index_dim = 256
chunk_chars = 800
chunk_overlap = 120
max_chunks_per_file = 40
max_file_mb = 20
batch_size = 16
index_images = yes
index_audio = no
index_video = no
auto_scan_on_start = no
ignore_dirs = .git,.svn,node_modules,__pycache__,.venv,venv,dist,build,out,target,.idea,.vs,.cache,$RECYCLE.BIN,System Volume Information,AppData,Windows,Program Files,Program Files (x86),.syncing_db,@Recently-Snapshot,@Recycle,#recycle,@eaDir,.snapshot,#snapshot,.@__thumb,@tmp,.thumbnails
skip_ext = .tmp,.temp,.log,.lock,.pyc,.pyo,.class,.o,.obj,.exe,.dll,.so,.pyd,.lib,.bin,.iso,.img,.vmdk,.dat,.db,.sqlite,.zip,.rar,.7z,.gz,.tar,.mp4,.mkv,.avi,.mov,.flv,.wmv
ocr_enabled = no
ocr_engine = auto
ocr_max_pages = 0
ocr_max_images = 0
ocr_page_from = 1
ocr_page_to = 0
web_provider = bing
searxng_url = 

[face]
enabled = yes
min_prob = 0.90
min_size = 60
assign_threshold = 0.78
search_threshold = 0.45
cluster_threshold = 0.75

[chat]
model_dir = models/Qwen2.5-1.5B-Instruct
device = auto
max_new_tokens = 600
temperature = 0.2
top_k = 5

[dify]
base_url = 
dataset_id = 
dataset_key = 
api_key = 

[sync]
server = 
user = 
password = 
token = 

[backup]
enabled = yes
dir = db
interval_hours = 6
keep = 10
snapshot_target = 

[multi]
local_strict = yes
allow_register = no

[ocr]
ppocr_python = 
ppocr_bridge = 
rapid_python = 
rapid_bridge = 
mineru_python = 
mineru_bridge = 
mineru_dir = 

